<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <defs>
    <linearGradient id="frameGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBA0" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#8F6B12" />
      <stop offset="100%" stop-color="#FFDF73" />
    </linearGradient>
    <linearGradient id="innerShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(85,11,24,0.05)" />
      <stop offset="100%" stop-color="rgba(85,11,24,0.25)" />
    </linearGradient>
  </defs>

  <!-- Outer Arch Border -->
  <path d="M 20,420 L 20,160 C 20,70 80,20 160,20 C 240,20 300,70 300,160 L 300,420 Z" 
        stroke="url(#frameGold)" stroke-width="3" fill="none" />

  <!-- Inner Dotted Arch Border -->
  <path d="M 32,410 L 32,165 C 32,85 86,34 160,34 C 234,34 288,85 288,165 L 288,410 Z" 
        stroke="url(#frameGold)" stroke-width="1.5" stroke-dasharray="4 3" fill="url(#innerShade)" />

  <!-- Top Crown Accent (Mahkota Lengkung) -->
  <circle cx="160" cy="20" r="7" fill="url(#frameGold)" />
  <circle cx="160" cy="20" r="3.5" fill="#FFF8DC" />
  <path d="M 140,22 Q 160,6 180,22" stroke="url(#frameGold)" stroke-width="2" fill="none" />
  
  <!-- Base Corner Florets -->
  <circle cx="20" cy="420" r="4.5" fill="url(#frameGold)" />
  <circle cx="300" cy="420" r="4.5" fill="url(#frameGold)" />
</svg>
