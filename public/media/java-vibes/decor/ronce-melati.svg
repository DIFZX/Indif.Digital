<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 380" fill="none">
  <defs>
    <linearGradient id="jasminePetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F5F0E4" />
      <stop offset="100%" stop-color="#E2D6C0" />
    </linearGradient>
    <linearGradient id="jasmineBud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#D9C9A8" />
    </linearGradient>
    <linearGradient id="melatiStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C6338" />
      <stop offset="100%" stop-color="#2E3F21" />
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9E7812" />
    </linearGradient>
  </defs>

  <!-- Curving vine / garland cord -->
  <path d="M 80,10 Q 55,90 90,170 T 70,270 T 80,360" stroke="url(#melatiStem)" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Blooming Melati Flowers along the string -->
  <!-- Flower 1 (Top) -->
  <g transform="translate(75, 30)">
    <circle cx="0" cy="0" r="14" fill="url(#jasminePetal)" />
    <!-- Petals -->
    <ellipse cx="-12" cy="0" rx="9" ry="6" fill="url(#jasminePetal)" />
    <ellipse cx="12" cy="0" rx="9" ry="6" fill="url(#jasminePetal)" />
    <ellipse cx="0" cy="-12" rx="6" ry="9" fill="url(#jasminePetal)" />
    <ellipse cx="0" cy="12" rx="6" ry="9" fill="url(#jasminePetal)" />
    <circle cx="0" cy="0" r="5" fill="url(#goldCap)" />
  </g>

  <!-- Buds 1 -->
  <g transform="translate(60, 75)">
    <path d="M0,0 C-6,10 6,18 0,26 C-6,18 6,10 0,0 Z" fill="url(#jasmineBud)" />
    <circle cx="0" cy="27" r="3" fill="url(#goldCap)" />
  </g>
  <g transform="translate(90, 100)">
    <path d="M0,0 C-6,10 6,18 0,26 C-6,18 6,10 0,0 Z" fill="url(#jasmineBud)" />
    <circle cx="0" cy="27" r="3" fill="url(#goldCap)" />
  </g>

  <!-- Flower 2 (Center Blooming) -->
  <g transform="translate(85, 150)">
    <circle cx="0" cy="0" r="16" fill="url(#jasminePetal)" />
    <ellipse cx="-14" cy="0" rx="10" ry="7" fill="url(#jasminePetal)" />
    <ellipse cx="14" cy="0" rx="10" ry="7" fill="url(#jasminePetal)" />
    <ellipse cx="0" cy="-14" rx="7" ry="10" fill="url(#jasminePetal)" />
    <ellipse cx="0" cy="14" rx="7" ry="10" fill="url(#jasminePetal)" />
    <ellipse cx="-10" cy="-10" rx="8" ry="8" fill="url(#jasminePetal)" />
    <ellipse cx="10" cy="10" rx="8" ry="8" fill="url(#jasminePetal)" />
    <circle cx="0" cy="0" r="6" fill="url(#goldCap)" />
  </g>

  <!-- Buds 2 -->
  <g transform="translate(70, 205)">
    <path d="M0,0 C-6,10 6,18 0,26 C-6,18 6,10 0,0 Z" fill="url(#jasmineBud)" />
    <circle cx="0" cy="27" r="3" fill="url(#goldCap)" />
  </g>
  <g transform="translate(95, 235)">
    <path d="M0,0 C-6,10 6,18 0,26 C-6,18 6,10 0,0 Z" fill="url(#jasmineBud)" />
    <circle cx="0" cy="27" r="3" fill="url(#goldCap)" />
  </g>

  <!-- Flower 3 -->
  <g transform="translate(72, 285)">
    <circle cx="0" cy="0" r="14" fill="url(#jasminePetal)" />
    <ellipse cx="-12" cy="0" rx="9" ry="6" fill="url(#jasminePetal)" />
    <ellipse cx="12" cy="0" rx="9" ry="6" fill="url(#jasminePetal)" />
    <ellipse cx="0" cy="-12" rx="6" ry="9" fill="url(#jasminePetal)" />
    <ellipse cx="0" cy="12" rx="6" ry="9" fill="url(#jasminePetal)" />
    <circle cx="0" cy="0" r="5" fill="url(#goldCap)" />
  </g>

  <!-- Hanging Ronce Pendant Tip (Bunga Kantil Emas) -->
  <g transform="translate(80, 340)">
    <path d="M0,0 C-8,14 -4,28 0,38 C4,28 8,14 0,0 Z" fill="url(#goldCap)" />
    <circle cx="0" cy="40" r="3.5" fill="#FFEAA5" />
  </g>
</svg>
