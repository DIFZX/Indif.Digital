<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="cornerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBA0" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9B7515" />
    </linearGradient>
  </defs>
  <!-- Outer Corner Frame Lines -->
  <path d="M 5,95 L 5,5 L 95,5" stroke="url(#cornerGold)" stroke-width="2.5" fill="none" />
  <path d="M 14,80 L 14,14 L 80,14" stroke="url(#cornerGold)" stroke-width="1.2" stroke-dasharray="3 2" fill="none" />
  
  <!-- Traditional Ukir Jepara / Lung-lungan Floral Corner -->
  <path d="M 5,5 Q 40,25 25,50 Q 15,35 5,5 Z" fill="url(#cornerGold)" opacity="0.9" />
  <path d="M 5,5 Q 25,40 50,25 Q 35,15 5,5 Z" fill="url(#cornerGold)" opacity="0.9" />
  <circle cx="28" cy="28" r="6" fill="url(#cornerGold)" />
  <circle cx="28" cy="28" r="3" fill="#FFF4C8" />
  
  <!-- Swirls / Sulur -->
  <path d="M 28,28 C 45,45 65,30 60,15 C 55,25 40,35 28,28 Z" fill="url(#cornerGold)" />
  <path d="M 28,28 C 45,45 30,65 15,60 C 25,55 35,40 28,28 Z" fill="url(#cornerGold)" />
  <circle cx="5" cy="5" r="4" fill="url(#cornerGold)" />
