<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA8214" />
      <stop offset="100%" stop-color="#FCE082" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B0F20" />
      <stop offset="100%" stop-color="#3D0610" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Gunungan Outer Silhouette -->
  <path d="M 200,20 
           C 225,90 270,160 310,230 
           C 350,300 375,370 375,440 
           C 375,510 330,550 200,560 
           C 70,550 25,510 25,440 
           C 25,370 50,300 90,230 
           C 130,160 175,90 200,20 Z" 
        fill="url(#maroonGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="5" />

  <!-- Inner Ornate Border -->
  <path d="M 200,45 
           C 220,105 258,168 294,232 
           C 330,296 352,360 352,425 
           C 352,488 312,525 200,535 
           C 88,525 48,488 48,425 
           C 48,360 70,296 106,232 
           C 142,168 180,105 200,45 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="2" 
        stroke-dasharray="4 3" />

  <!-- Gunungan Peak Crown (Makutha) -->
  <circle cx="200" cy="22" r="8" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  <path d="M 194,32 L 206,32 L 203,75 L 197,75 Z" fill="url(#goldGrad)" />
  <circle cx="200" cy="55" r="5" fill="#FFE899" />

  <!-- Pohon Hayat (Tree of Life Central Trunk) -->
  <path d="M 197,120 L 203,120 L 205,480 L 195,480 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Symmetrical Floral & Foliage Branches -->
  <!-- Level 1 (Top) -->
  <path d="M 200,140 Q 235,115 255,145 Q 235,160 200,165" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  <path d="M 200,140 Q 165,115 145,145 Q 165,160 200,165" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="255" cy="145" r="4" fill="url(#goldGrad)" />
  <circle cx="145" cy="145" r="4" fill="url(#goldGrad)" />

  <!-- Level 2 -->
  <path d="M 200,200 Q 260,165 290,210 Q 255,235 200,230" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 200,200 Q 140,165 110,210 Q 145,235 200,230" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="290" cy="210" r="5" fill="url(#goldGrad)" />
  <circle cx="110" cy="210" r="5" fill="url(#goldGrad)" />

  <!-- Level 3 -->
  <path d="M 200,270 Q 285,230 320,290 Q 275,320 200,305" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 200,270 Q 115,230 80,290 Q 125,320 200,305" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="320" cy="290" r="5.5" fill="url(#goldGrad)" />
  <circle cx="80" cy="290" r="5.5" fill="url(#goldGrad)" />

  <!-- Central Gapura (Portal of Eternity) -->
  <path d="M 160,370 L 240,370 L 240,490 L 160,490 Z" fill="#2A040B" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 150,370 Q 200,335 250,370 Z" fill="url(#goldGrad)" />
  <path d="M 200,370 L 200,490" stroke="url(#goldGrad)" stroke-width="2" />
  <!-- Portal Door Knobs -->
  <circle cx="185" cy="430" r="4" fill="url(#goldGrad)" />
  <circle cx="215" cy="430" r="4" fill="url(#goldGrad)" />

  <!-- Wings of Garuda / Flame motifs on the sides -->
  <path d="M 150,390 C 110,380 90,430 110,470 C 130,460 145,430 150,410 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 250,390 C 290,380 310,430 290,470 C 270,460 255,430 250,410 Z" fill="url(#goldGrad)" opacity="0.8" />

  <!-- Bottom Pedestal (Pondasi Candi) -->
  <path d="M 130,490 L 270,490 L 290,525 L 110,525 Z" fill="url(#goldGrad)" />
  <path d="M 150,525 L 250,525 L 255,545 L 145,545 Z" fill="#3D0610" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M 197,545 L 203,545 L 203,585 L 197,585 Z" fill="url(#goldGrad)" />
</svg>
